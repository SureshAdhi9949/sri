<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6BE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#99751A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="2.5" fill="#091324" opacity="0.9" />
  <circle cx="50" cy="50" r="41" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Stylized Geometric Crown / S Monogram -->
  <path d="M50 16 L68 36 L59 36 L50 26 L41 36 L32 36 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <path d="M35 44 C35 39, 65 37, 65 50 C65 62, 35 60, 35 72 C35 80, 65 80, 65 74" 
        stroke="url(#goldGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Architectural Pillar accents -->
  <line x1="28" y1="48" x2="28" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="72" y1="48" x2="72" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="24" y1="80" x2="76" y2="80" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>

